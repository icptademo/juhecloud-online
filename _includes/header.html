<header class="site-header">
<div class="shell header-inner">
<a class="brand" href="{{ '/' | relative_url }}">
<span class="brand-mark" aria-hidden="true">聚</span>
<span>
<span class="brand-name">聚合云充值</span>
<span class="brand-domain">juhecloud.online</span>
</span>
</a>
<nav class="site-nav" aria-label="主导航">
<a href="{{ '/' | relative_url }}" {% if page.url == "/" %}aria-current="page"{% endif %}>首页</a>
{% assign articles = site.pages | where: "article", true | sort: "list_order" %}
{% for article in articles %}
<a href="{{ article.url | relative_url }}" {% if page.url == article.url %}aria-current="page"{% endif %}>{{ article.nav_title }}</a>
{% endfor %}
<a href="https://www.juhecloud.online" rel="noopener noreferrer">官网</a>
</nav>
</div>
</header>
